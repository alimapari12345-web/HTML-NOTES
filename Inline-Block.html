<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .profile-box{
      padding:10px;
      border: 8px solid orange;
    }
    .Name{
      color:rgb(0, 13, 255)
    }
    .box-2{
      border: 2px solid black
    }
    .box-3{
      border: 2px solid black
    }
    .A-box{
      display:inline-block;
      padding-bottom: 40px;
      padding-left:40px ;
      padding-right:40px;
      border: 2px solid black;
    }
    .B-box{
      display:inline-block;
      padding-bottom: 40px;
      padding-left:40px ;
      padding-right:40px;
      border: 2px solid black;
    }

  </style>
</head>
<body >
  <div class="profile-box">
    <h1>Ali</h1>
    <p>Computer Engineering</p>
  </div>
  <p>Hello! My name is <span class="Name">Ali</span>. I love Web designing.</p>
  <div class="box-2"> I am a block element.</div>
  <span class="box-3"> I am an inline element.</span>
  <span class="A-box">Box A</span>
  <span class="B-box">Box B</span>
</body>
</html>
