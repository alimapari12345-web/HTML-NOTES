<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body style="font-size:larger">
<h1>Shutter Club Regestration</h1>
<fieldset>

  <legend>Artist details</legend>
  <label for="name">Name:</label>
  <input type="text" id="name" name="'name" required>

  <label for="email"> Email:</label>
  <input type="email" id="email" name="email" required>

  <label for="pwd"> Password:</label>
  <input type="password" id="pwd" name="Password" required>

  <label for="date">Date of Birth:</label>
  <input type="date" id="date" name="date" required>

  <label for="years">Years Painting as professional:</label>
  <input type="number" id="years" name="years" min="15" max="75" required>
</fieldset>
<fieldset>
  <legend>Membership Details</legend><br><br>
  <label for="experience">Experience:</label><br>

  <label for="beginner">Beginner</label>
  <input type="radio" id="beginner" name="experience" required>

  <label for="intermidiate">Intermediate</label>
  <input type="radio" id="intermidiate" name="experience" required>

  <label for="advanced">Advanced</label>
  <input type="radio" id="advanced" name="experience" required><br><br>

  <label for="art type">Types of artry you paint:</label>

  <label for="potrait">Potrait</label>
  <input type="checkbox" id="potrait" name="art type" required>

  <label for="landscape">Landscape</label>
  <input type="checkbox" id="landscape" name="art type" required>

  <label for="abstract">Abstract</label>
  <input type="checkbox" id="abstract" name="art type" required>
  <br><br>

  <label for="paint type">Types of colour you use</label>
  <select id="paint type" name="paint type" required>
    <optgroup label="Paint">Paint</optgroup>
      <option label="Water colour">Water Colour</option>
      <option label="Acrylic" selected>Acrylic paints </option>
    <optgroup label="Pencil">Pencil</optgroup>
      <option label="Colour Pencil">Colour Pencil</option>
      <option label="Shading Pencil">Shading pencil</option>
  </select>
<br><br>
<label for="sample photo">Upload a Sample Photo:</label>
<input type="file" id="sample photo" name="sample photo">
<br><br>
<label for="reason">Tell us why do you want to join?</label><br>
<textarea
id="reason"
name="reason"
rows="10"
cols="50"
placeholder="Tell us why briefly..."></textarea>
<br><br>
<input type="submit" value="Register"/>
<input type="reset" value="Clear form">

</fieldset>
</body>
</html>
