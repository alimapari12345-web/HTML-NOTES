<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form>
    <label for="name">Full Name:</label><br>
    <input type="text"
    id="text"
    minlength="5"
    maxlength="20"
    required
    placeholder="Enter your full name">
    <br><br><br>
    <label for="email">Email:</label><br>
    <input type="email"
    id="email"
    placeholder="abc@gmail.com"
    required>
    <br><br><br>
    <label for="pwd">Enter Password:</label><br>
    <input type="password"
    id="pwd"
    placeholder="Min 8 charecters"
    minlength="8"
    maxlength="15"
    required>
    <br><br><br>
    <label for="no">Phone Number:</label><br>
    <input type="tel"
    pattern="(0-9){10}"
    placeholder="10 digit Mobile Number"
    required>
    <br><br><br>
    <label for="dob">Date of Birth</label><br>
    <input type="date"
    id="dob"
    required>
    <br><br><br>
    <label for="web">Website:</label><br>
    <input type="url"
    placeholder="https://example.com"
    required><br>
    <br><br><br>
    <button type="submit">Submit</button>


  </form>
</body>
</html>
